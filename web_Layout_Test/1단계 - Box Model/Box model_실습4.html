<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model_실습4</title>
</head>

<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    body {
        margin: 0px;
        padding: 30px;
    }

    div.box4{
        width:300px;
        height: 100px;
        background-color: #2cec71;
        color:white;
        
        text-align:center;
        /*글자만 가운데 정렬이 되는 것이 아님. 태그 안의 요소들이 가는 거임*/
        padding:30px;
    }

</style>

<body>
    <div class="box4">콘텐츠 높이 가운데 정렬</div>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 실습3 Inline-block</title>

</head>

<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    div.inline-block-box {
        background-color: #2ecc71;
        color: white;
        width: 300px;
        height: 80px;
        text-align: center;
        padding: 10px;
        margin: 5px;
        line-height: 40px;
        display: inline-block;
        /* 1번display: block; 반복해서 적용 연습 가능 */
        /*2번 display:"inline-block" 설정한다.
    span태그에 a태그 넣으면 인라인블록이 됨*/
    }
</style>

<body>
    <h2>Inline-block 요소(태그) 확인</h2>
    <div class="inline-block-box">박스1</div>
    <div class="inline-block-box">박스2</div>
    <div class="inline-block-box">박스3</div>

</body>

</html>

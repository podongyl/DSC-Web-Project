<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 실습4 none</title>

</head>

<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    div.box-visible {
        background-color: #349bdb;
        color: white;
        padding: 10px;
        margin: 5px;

    }

    div.box-none {
        background-color: #e74c3c;
        color: white;
        padding: 10px;
        margin: 5px;
        /*display:"none"* 번갈아가며 적용해보기/
    /*display:"block";*/
        display:none;
    }

    /*none은 위치값 자체가 빠져버림*/
    div.box-hidden {
        background-color: #9b59bd;
        color: white;
        padding: 10px;
        margin: 5px;

        /*visibility:"hidden"*/
        /*visibility:"visible"*/
        visibility:hidden;
    }
</style>

<body>
    <div class="box-visible">① 보이는 박스</div>
    <div class="box-none">② display:"none" → 완전히 사라짐</div>
    <div class="box-hidden">③ Visibility:"hidden" → 공간만 남기기</div>
    <div class="box-visible">④ 보이는 박스</div>

</body>

</html>

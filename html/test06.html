<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앵커링크연습 a태그</title>
</head>

<body>
    <!--링크(a태그)에 속성 적용-->
    <a href="https://www.naver.com" target="_blank" title="네이버로 이동!">예제사이트 방문</a>

    <!--이미지(img태그)에 속성 적용-->
    <img src="/img/강아지1.png" alt="하얀색 비숑 강아지" width="200" height="200">
    <img src="/img/강아지2.png" alt="닥스훈트" width="200" height="200">

    <!--입력 폼(input 태그)에 속성 적용-->
    <form action="submit.php" method="get">
        <label for="username">사용자 이름:</label>
        <input type="text" id="username" name="username" placeholder="이름입력" required="required">
        <input type="submit" value="제출">
    </form>

    <!--단락(p태그) 속성 적용-->
    <p style="color: blue; font-weight: bold;">이 문장은 파란색 굵은 글씨입니다.</p>

</body>

</html>
